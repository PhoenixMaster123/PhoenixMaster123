# REPLACE the contents of .github/workflows/snake.yml with this.
# Do NOT add a second workflow that also pushes to the "output" branch --
# they would overwrite each other's files. One workflow, one push.

name: Generate Contribution Games

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # ---------------- 1. Snake ----------------
      - name: Generate snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b  # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#00e5ff
            dist/snake-dark.svg?palette=github-dark&color_snake=#00e5ff

      # Stash it: the arcade action rebuilds dist/ and would wipe the snake
      - name: Stash snake output
        run: |
          mkdir -p staging
          cp dist/*.svg staging/
          rm -rf dist

      # ---------------- 2. Arcade games ----------------
      # games: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
      - name: Generate arcade games
        # Pinned to the then-current main; @main ran whatever was pushed to it.
        uses: abozanona/pacman-contribution-graph@7332e1de7903ab780c3692a4127a59cc13872daa  # main @ 2026-08-22
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga"
          hide_month_labels: "false"

      # ---------------- 3. Merge + push once ----------------
      - name: Merge snake back in
        run: |
          mkdir -p dist
          cp staging/*.svg dist/
          echo "Files to publish:"
          ls -la dist/

      - name: Push all SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@5859b4ea7efe6b470a5b19c570460eae9323aefc  # v3.2.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
